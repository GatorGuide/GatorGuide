name: Planner Refresh

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gator-guide-refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    name: Refresh planner data and publish GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install app dependencies
        working-directory: source
        run: npm ci

      - name: Check Rust automation
        run: |
          cargo fmt --manifest-path automation/Cargo.toml -- --check
          cargo test --locked --manifest-path automation/Cargo.toml
          cargo fmt --manifest-path automation/workflow-actions/Cargo.toml -- --check
          cargo test --locked --manifest-path automation/workflow-actions/Cargo.toml
          cargo build --locked --release --manifest-path automation/workflow-actions/Cargo.toml

      - name: Refresh planner data
        if: github.event_name != 'push'
        run: cargo run --locked --release --manifest-path automation/Cargo.toml -- refresh-planner

      - name: Publish refreshed planner data and create release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --release --manifest-path automation/workflow-actions/Cargo.toml -- publish-planner

      - name: Export static web app
        working-directory: source
        env:
          EXPO_BASE_URL: /GatorGuide
        run: npm run web:export

      - name: Prepare GitHub Pages fallback route
        run: cargo run --locked --release --manifest-path automation/workflow-actions/Cargo.toml -- copy-pages-fallback

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
