name: Planner Refresh

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gator-guide-refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    name: Refresh planner data and publish GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install app dependencies
        working-directory: source
        run: npm ci

      - name: Check Rust automation
        run: |
          cargo fmt --manifest-path automation/Cargo.toml -- --check
          cargo test --locked --manifest-path automation/Cargo.toml

      - name: Refresh planner data
        if: github.event_name != 'push'
        run: cargo run --locked --release --manifest-path automation/Cargo.toml -- refresh-planner

      - name: Publish refreshed planner data and create release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            source/data/starter-opportunities.json \
            source/constants/green-river-major-options.generated.ts \
            source/constants/transfer-equivalency-catalog.generated.ts \
            source/constants/transfer-planner-grc-availability.generated.ts \
            source/constants/transfer-planner-source/ \
            source/docs/planner/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(planner): refresh official source data"
            if ! git push origin HEAD:main; then
              git fetch origin main
              git merge --no-edit origin/main
              git push origin HEAD:main
            fi
          else
            echo "Planner data is unchanged; no data commit is needed."
          fi
          git fetch origin main
          release_target="$(git rev-parse origin/main)"
          tag="planner-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --target "$release_target" \
            --title "Planner refresh ${GITHUB_RUN_NUMBER}" \
            --notes "Automated weekly planner refresh. Refreshed public data is committed to main when source outputs change."

      - name: Export static web app
        working-directory: source
        env:
          EXPO_BASE_URL: /GatorGuide
        run: |
          npm run web:export
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
