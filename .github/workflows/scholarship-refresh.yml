name: Scholarship Source Review (Dormant)

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Collect deterministic scholarship source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build deterministic source report
        run: >-
          cargo run --locked --release --manifest-path automation/Cargo.toml --
          collect-opportunities --category scholarships
          --output "${RUNNER_TEMP}/scholarship-candidates.json"

      - name: Upload review-only candidates
        uses: actions/upload-artifact@v4
        with:
          name: scholarship-source-candidates
          path: ${{ runner.temp }}/scholarship-candidates.json
          if-no-files-found: error
          retention-days: 14
