name: Transfer Category Equivalencies Monthly Refresh

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gator-guide-refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh-transfer-equivalencies:
    if: github.ref == 'refs/heads/main'
    name: Refresh UW Green River equivalencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Check Rust equivalency refresh tool
        run: |
          cargo fmt --manifest-path automation/equivalency-refresh/Cargo.toml -- --check
          cargo test --locked --manifest-path automation/equivalency-refresh/Cargo.toml
          cargo build --locked --release --manifest-path automation/equivalency-refresh/Cargo.toml
          cargo fmt --manifest-path automation/workflow-actions/Cargo.toml -- --check
          cargo test --locked --manifest-path automation/workflow-actions/Cargo.toml
          cargo build --locked --release --manifest-path automation/workflow-actions/Cargo.toml

      - name: Refresh UW Green River Equivalency Guide data
        run: cargo run --locked --release --manifest-path automation/equivalency-refresh/Cargo.toml -- refresh-equivalencies

      - name: Publish refreshed equivalencies
        run: cargo run --locked --release --manifest-path automation/workflow-actions/Cargo.toml -- publish-equivalencies
